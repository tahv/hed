[project]
name = "hed"
description = "Extract release notes from markdown changelog"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Thibaud Gambier" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
  "Typing :: Typed",
]
dependencies = [
  "cyclopts>=5.2.0",
  "mistletoe>=1.6.0",
  "pygit2>=1.20.1",
  "rich>=15.0.0",
  "typing-extensions>=4.16.0",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/tahv/hed"

[project.scripts]
hed = "hed.cli:app"

[dependency-groups]
dev = [
  { include-group = "test" },
  { include-group = "types" },
]
test = [
  "coverage>=7.16.2",
  "pytest>=9.1.1",
]
types = [
  "mypy>=2.4.0",
]

[build-system]
requires = [
  "hatchling==1.32.0",
  "uv-dynamic-versioning==0.14.1",
]
build-backend = "hatchling.build"

[tool.coverage]
run.branch = true
run.omit = ["*/__main__.py"]
run.source = ["src"]
report.show_missing = true
report.skip_covered = true
report.exclude_lines = [
  '# pragma: no cover\b',
  '^\s*raise AssertionError\b',
  '^\s*raise NotImplementedError\b',
  '^\s*return NotImplemented\b',
  '^\s*raise\s*$',
  "if (False|0|TYPE_CHECKING):",
  "if __name__ == ['\"]__main__['\"]:",
  '(^|:)\s*\.\.\.\s*(#|$)',
  "-> ['\"]?NoReturn['\"]?:",
]

[tool.creosote]
include-deferred = true
sections = [
  "project.dependencies",
  "project.optional-dependencies.test",
  "project.optional-dependencies.types",
]

[tool.hatch]
version.source = "uv-dynamic-versioning"

[tool.hed]
changelog = "CHANGELOG.md"
title = "Release Notes"
top-heading = 2
diff-url = "https://github.com/tahv/hed/compare/{prev}...{tag}"
capture-start = '^## \[{tag}\]'
capture-end = "^## "
softbreak = false

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src", "tests"]
untyped_calls_exclude = ["cyclopts", "mistletoe"]

[tool.pytest]
addopts = [
  "--doctest-modules",
  "--doctest-report=ndiff",
  "--durations-min=0.005",
  "--durations=0",
  "--import-mode=importlib",
]
minversion = "9.0"
testpaths = ["src", "tests"]

[tool.ruff]
format.preview = true
include = ["src/**/*.py", "tests/**/*.py", "**/pyproject.toml"]
lint.pydocstyle.convention = "google"
lint.preview = false
lint.flake8-tidy-imports.ban-relative-imports = "all"
lint.isort.required-imports = ["from __future__ import annotations"]
lint.select = ["ALL"]
lint.ignore = [
  "CPY001",  # Missing copyright notice at top of file
  "D100",  # Missing docstring in public module
  "D104",  # Missing docstring in public package
  "D107",  # Missing docstring in `__init__`
  "D105",  # Missing docstring in magic method
  "FIX002",  # Line contains TODO, consider resolving the issue
  "PLR0913",  # Too many arguments in function definition
  "S101",  # Use of `assert` detected
  "TD003",  # Missing issue link for this TODO
]
lint.per-file-ignores."tests/**/test_*.py" = [
  "D103",  # Missing docstring in public function
]

[tool.rumdl]
line_length = 80
flavor = "standard"
MD013.reflow = true
MD013.reflow-mode = "semantic-line-breaks"
per-file-ignores."changelog.d/*.md" = [
  "MD041",  # First line in file should be a level 1 heading
]
per-file-ignores.".gitlab/merge_request_templates/Default.md" = [
  "MD041",  # First line in file should be a level 1 heading
]

[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = ""
issue_format = "[!{issue}](https://github.com/tahv/hed/issues/{issue})"
template = "changelog.d/template.md.jinja"
type = [
  { directory = "break", name = "Breaking changes", showcontent = true },
  { directory = "feat", name = "Enhancements", showcontent = true },
  { directory = "fix", name = "Bug fixes", showcontent = true },
  { directory = "docs", name = "Documentation", showcontent = true },
  { directory = "refactor", name = "Refactorings", showcontent = true },
  { directory = "style", name = "Miscellaneous", showcontent = true },
  { directory = "chore", name = "Miscellaneous", showcontent = true },
  { directory = "ci", name = "Miscellaneous", showcontent = true },
  { directory = "test", name = "Miscellaneous", showcontent = false },
  { directory = "revert", name = "Revert", showcontent = true },
]

[tool.ty]
analysis.respect-type-ignore-comments = false
src.include = ["src", "tests"]
terminal.output-format = "concise"
terminal.error-on-warning = true

[tool.typos.default.extend-words]
hed = "hed"
Hed = "Hed"

[tool.uv]
default-groups = ["dev"]
cache-keys = [
  { file = "pyproject.toml" },
  { git = { commit = true, tags = true } },
]

[tool.uv-dynamic-versioning]
bump = true
pattern = "default-unprefixed"
